<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⋆˚꩜｡ yenvy's booth</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Patrick+Hand&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

:root {
    --paper: #f3f0e8;
    --ink: #252525;
    --soft-ink: #66615a;
    --white: #faf9f4;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at 20% 20%, rgba(0,0,0,.035) 0 1px, transparent 1px),
        radial-gradient(circle at 70% 80%, rgba(0,0,0,.025) 0 1px, transparent 1px),
        var(--paper);

    background-size: 18px 18px, 25px 25px;

    color: var(--ink);

    font-family: "Patrick Hand", cursive;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px 18px;

    overflow-x: hidden;
}


/* =====================================
   MAIN
===================================== */

.booth {
    width: 100%;
    max-width: 1050px;

    position: relative;

    text-align: center;
}


/* =====================================
   DOODLES
===================================== */

.doodle {
    position: absolute;

    font-family: "Caveat", cursive;

    color: var(--ink);

    pointer-events: none;

    z-index: 1;
}

.doodle.one {
    top: -20px;
    left: 5%;

    font-size: 28px;

    transform: rotate(-12deg);
}

.doodle.two {
    top: 90px;
    right: 5%;

    font-size: 25px;

    transform: rotate(9deg);
}

.doodle.three {
    bottom: 60px;
    left: 3%;

    font-size: 25px;

    transform: rotate(8deg);
}

.doodle.four {
    bottom: 10px;
    right: 6%;

    font-size: 24px;

    transform: rotate(-8deg);
}


/* =====================================
   TITLE
===================================== */

.title-small {
    font-family: "DM Mono", monospace;

    font-size: 10px;

    letter-spacing: 3px;

    margin-bottom: 2px;

    opacity: .65;
}

h1 {
    margin: 0;

    font-family: "Caveat", cursive;

    font-size: clamp(55px, 9vw, 90px);

    font-weight: 600;

    line-height: .8;

    transform: rotate(-2deg);
}

.subtitle {
    margin-top: 15px;

    font-family: "Patrick Hand", cursive;

    font-size: 20px;

    color: var(--soft-ink);

    transform: rotate(1deg);
}


/* =====================================
   CAMERA LAYOUT
===================================== */

.camera-area {
    display: flex;

    justify-content: center;

    align-items: center;

    gap: 70px;

    flex-wrap: wrap;

    margin-top: 35px;
}


/* =====================================
   CAMERA
===================================== */

.camera-section {
    position: relative;
}

.camera-frame {
    position: relative;

    width: min(560px, 92vw);

    padding: 12px;

    background: #1d1d1d;

    transform: rotate(-1deg);

    box-shadow:
        4px 5px 0 rgba(0,0,0,.12),
        0 15px 35px rgba(0,0,0,.15);
}


/* Tape */

.camera-frame::before {
    content: "";

    position: absolute;

    width: 100px;
    height: 24px;

    background: rgba(235,230,211,.85);

    top: -12px;
    left: 50%;

    transform:
        translateX(-50%)
        rotate(-2deg);

    z-index: 5;

    opacity: .8;
}


/* Camera */

video {
    width: 100%;

    display: block;

    aspect-ratio: 4 / 3;

    object-fit: cover;

    background: #111;

    transform: scaleX(-1);

    filter:
        grayscale(1)
        contrast(1.08)
        brightness(.98);
}


/* =====================================
   COUNTDOWN
===================================== */

.countdown {
    position: absolute;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    color: white;

    font-family: "Caveat", cursive;

    font-size: 130px;

    font-weight: 700;

    text-shadow:
        2px 2px 0 rgba(0,0,0,.5);

    opacity: 0;

    pointer-events: none;

    transition: opacity .15s;
}

.countdown.show {
    opacity: 1;
}


/* =====================================
   CAMERA LABEL
===================================== */

.camera-label {
    position: absolute;

    bottom: -22px;
    left: 12px;

    font-family: "DM Mono", monospace;

    font-size: 9px;

    letter-spacing: 1px;

    transform: rotate(-2deg);

    color: var(--soft-ink);
}


/* =====================================
   BUTTONS
===================================== */

.controls {
    margin-top: 35px;

    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;
}

button {
    border: 1.5px solid var(--ink);

    background: transparent;

    color: var(--ink);

    padding: 10px 21px;

    font-family: "Patrick Hand", cursive;

    font-size: 18px;

    cursor: pointer;

    border-radius: 4px;

    transform: rotate(-1deg);

    box-shadow: 2px 2px 0 var(--ink);

    transition: .15s;
}

button:nth-child(even) {
    transform: rotate(1deg);
}

button:hover {
    background: var(--ink);

    color: white;

    transform:
        rotate(-1deg)
        translateY(-2px);
}

button:active {
    transform:
        rotate(-1deg)
        translate(2px, 2px);

    box-shadow: none;
}

button:disabled {
    opacity: .35;

    cursor: not-allowed;

    box-shadow: none;
}


/* =====================================
   STATUS
===================================== */

.status {
    margin-top: 15px;

    font-size: 16px;

    color: var(--soft-ink);

    min-height: 22px;
}


/* =====================================
   INSTRUCTIONS
===================================== */

.instructions {
    margin-top: 40px;

    font-family: "Caveat", cursive;

    font-size: 20px;

    transform: rotate(-1deg);

    color: var(--soft-ink);
}


/* =====================================
   PHOTO STRIP
===================================== */

.strip-wrapper {
    display: none;

    justify-content: center;

    position: relative;
}

.strip-container {
    position: relative;
}


/* Tape on strip */

.strip-container::before {
    content: "";

    position: absolute;

    width: 75px;
    height: 20px;

    background: rgba(230,225,207,.9);

    top: -12px;
    left: 50%;

    transform:
        translateX(-50%)
        rotate(3deg);

    z-index: 5;
}


.strip {
    width: 250px;

    padding: 16px 14px 20px;

    background:
        radial-gradient(
            circle,
            rgba(0,0,0,.03) 0 1px,
            transparent 1px
        ),
        #faf9f4;

    background-size: 13px 13px;

    box-shadow:
        5px 7px 0 rgba(0,0,0,.1),
        0 15px 30px rgba(0,0,0,.15);

    transform: rotate(2deg);
}


/* =====================================
   STRIP HEADER
===================================== */

.strip-header {
    margin-bottom: 12px;

    text-align: center;
}

.strip-title {
    font-family: "Caveat", cursive;

    font-size: 27px;

    font-weight: 600;

    line-height: 1;

    transform: rotate(-2deg);
}

.strip-subtitle {
    margin-top: 5px;

    font-family: "DM Mono", monospace;

    font-size: 7px;

    letter-spacing: 2px;

    color: #777;
}


/* =====================================
   PHOTOS
===================================== */

.photo {
    width: 100%;

    aspect-ratio: 4 / 3;

    object-fit: cover;

    display: block;

    margin-bottom: 9px;

    background: #ddd;

    filter:
        grayscale(1)
        contrast(1.1);

    border: 1px solid #222;
}


/* =====================================
   STRIP FOOTER
===================================== */

.strip-footer {
    margin-top: 11px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-family: "DM Mono", monospace;

    font-size: 7px;

    letter-spacing: 1px;

    color: #666;
}

.doodle-mark {
    font-family: "Caveat", cursive;

    font-size: 18px;

    letter-spacing: 0;
}


/* =====================================
   HIDDEN
===================================== */

.hidden {
    display: none !important;
}

canvas {
    display: none;
}


/* =====================================
   MOBILE
===================================== */

@media (max-width: 700px) {

    body {
        padding: 25px 12px;
    }

    .camera-area {
        gap: 35px;
    }

    .doodle.one {
        left: 1%;
    }

    .doodle.two {
        right: 1%;
    }

    .instructions {
        margin-top: 30px;
    }
}

</style>
</head>


<body>


<div class="booth">


    <!-- DOODLES -->

    <div class="doodle one">
        .✦ ݁˖
    </div>

    <div class="doodle two">
        ❀.ೃ࿔*:･
    </div>

    <div class="doodle three">
        𖦹
    </div>

    <div class="doodle four">
        ⋆˚꩜｡
    </div>


    <!-- TITLE -->

    <div class="title-small">
        FILM ROLL 001
    </div>

    <h1>
        yenvy's booth
    </h1>

    <div class="subtitle">
        ⋆˚꩜｡ black & white edition
    </div>


    <!-- CAMERA -->

    <div class="camera-area">


        <div
            id="cameraSection"
            class="camera-section">


            <div class="camera-frame">

                <video
                    id="video"
                    autoplay
                    playsinline>
                </video>


                <div
                    id="countdown"
                    class="countdown">

                    3

                </div>

            </div>


            <div class="camera-label">
                [ look here 𖦹 ]
            </div>


            <div class="controls">

                <button id="startButton">
                    start ˚₊‧
                </button>


                <button
                    id="takeButton"
                    disabled>

                    take 4 photos

                </button>

            </div>


            <div
                id="status"
                class="status">

                ⋆˚꩜｡ waiting for camera

            </div>

        </div>



        <!-- PHOTO STRIP -->

        <div
            id="stripWrapper"
            class="strip-wrapper">


            <div class="strip-container">


                <div class="strip">


                    <div class="strip-header">

                        <div class="strip-title">
                            yenvy's booth
                        </div>


                        <div class="strip-subtitle">
                            ⋆˚꩜｡ DEVELOPED IN THE MOMENT
                        </div>

                    </div>


                    <img
                        id="photo1"
                        class="photo"
                        alt="photo 1">


                    <img
                        id="photo2"
                        class="photo"
                        alt="photo 2">


                    <img
                        id="photo3"
                        class="photo"
                        alt="photo 3">


                    <img
                        id="photo4"
                        class="photo"
                        alt="photo 4">


                    <div class="strip-footer">

                        <span id="date"></span>


                        <span class="doodle-mark">
                            .✦ ݁˖
                        </span>


                        <span>
                            ROLL 001
                        </span>

                    </div>

                </div>


                <div class="controls">

                    <button id="retakeButton">
                        ↻ retake
                    </button>


                    <button id="downloadButton">
                        ↓ save strip
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- INSTRUCTIONS -->

    <div class="instructions">

        allow camera access
        → pose
        → wait for the click
        → repeat

    </div>


</div>



<canvas id="canvas"></canvas>



<script>

/* =====================================
   ELEMENTS
===================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const countdown =
    document.getElementById("countdown");

const startButton =
    document.getElementById("startButton");

const takeButton =
    document.getElementById("takeButton");

const statusText =
    document.getElementById("status");

const cameraSection =
    document.getElementById("cameraSection");

const stripWrapper =
    document.getElementById("stripWrapper");

const retakeButton =
    document.getElementById("retakeButton");

const downloadButton =
    document.getElementById("downloadButton");


const photos = [

    document.getElementById("photo1"),

    document.getElementById("photo2"),

    document.getElementById("photo3"),

    document.getElementById("photo4")

];


let stream = null;

let capturedPhotos = [];



/* =====================================
   START CAMERA
===================================== */

async function startCamera() {


    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        statusText.textContent =
            "Camera unavailable — open the GitHub Pages HTTPS link.";

        return;
    }


    try {


        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    },

                    facingMode: "user"

                },

                audio: false

            });


        video.srcObject =
            stream;


        await video.play();


        startButton.disabled =
            true;


        takeButton.disabled =
            false;


        statusText.textContent =
            "camera ready ⋆˚꩜｡";

    }


    catch (error) {


        console.error(
            "Camera error:",
            error
        );


        if (
            error.name ===
            "NotAllowedError"
        ) {

            statusText.textContent =
                "camera permission denied — allow access and try again.";

        }


        else if (
            error.name ===
            "NotFoundError"
        ) {

            statusText.textContent =
                "no camera found on this device.";

        }


        else {

            statusText.textContent =
                "couldn't access camera — make sure you're using HTTPS.";

        }

    }

}



/* =====================================
   COUNTDOWN
===================================== */

function runCountdown(seconds) {

    return new Promise(resolve => {


        let number =
            seconds;


        countdown.textContent =
            number;


        countdown.classList.add(
            "show"
        );


        const interval =
            setInterval(() => {


                number--;


                if (
                    number <= 0
                ) {


                    clearInterval(
                        interval
                    );


                    countdown.classList.remove(
                        "show"
                    );


                    resolve();

                }


                else {


                    countdown.textContent =
                        number;

                }

            }, 1000);

    });

}



/* =====================================
   CAPTURE PHOTO
===================================== */

function capturePhoto() {


    const width =
        video.videoWidth;


    const height =
        video.videoHeight;


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    /* Mirror image */

    ctx.save();


    ctx.translate(
        width,
        0
    );


    ctx.scale(
        -1,
        1
    );


    ctx.drawImage(

        video,

        0,
        0,

        width,
        height

    );


    ctx.restore();



    /* Convert to black & white */

    const imageData =
        ctx.getImageData(

            0,
            0,

            width,
            height

        );


    const pixels =
        imageData.data;


    for (
        let i = 0;
        i < pixels.length;
        i += 4
    ) {


        const r =
            pixels[i];


        const g =
            pixels[i + 1];


        const b =
            pixels[i + 2];


        let gray =

            0.299 * r +

            0.587 * g +

            0.114 * b;


        /* Contrast */

        gray =
            ((gray - 128) * 1.12) +
            128;


        /* Film grain */

        const grain =
            (Math.random() - .5) * 8;


        gray += grain;


        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );


        pixels[i] =
            gray;


        pixels[i + 1] =
            gray;


        pixels[i + 2] =
            gray;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas.toDataURL(
        "image/jpeg",
        .92
    );

}



/* =====================================
   TAKE FOUR PHOTOS
===================================== */

async function takePhotos() {


    takeButton.disabled =
        true;


    capturedPhotos = [];


    for (
        let i = 0;
        i < 4;
        i++
    ) {


        statusText.textContent =
            `frame ${i + 1} / 4  ⋆˚꩜｡`;


        await runCountdown(
            3
        );


        const photo =
            capturePhoto();


        capturedPhotos.push(
            photo
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    900
                )
        );

    }


    showStrip();

}



/* =====================================
   SHOW STRIP
===================================== */

function showStrip() {


    for (
        let i = 0;
        i < 4;
        i++
    ) {

        photos[i].src =
            capturedPhotos[i];

    }


    const today =
        new Date();


    const formattedDate =

        today.getFullYear() +

        "." +

        String(
            today.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +

        "." +

        String(
            today.getDate()
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "date"
    ).textContent =
        formattedDate;


    cameraSection
        .classList
        .add(
            "hidden"
        );


    stripWrapper.style.display =
        "flex";


    statusText.textContent =
        "your roll is ready .✦ ݁˖";

}



/* =====================================
   RETAKE
===================================== */

retakeButton.addEventListener(
    "click",
    () => {


        capturedPhotos = [];


        stripWrapper.style.display =
            "none";


        cameraSection
            .classList
            .remove(
                "hidden"
            );


        takeButton.disabled =
            false;


        statusText.textContent =
            "ready when you are ⋆˚꩜｡";

    }
);



/* =====================================
   SAVE STRIP
===================================== */

downloadButton.addEventListener(
    "click",
    () => {


        if (
            capturedPhotos.length !== 4
        ) {

            return;

        }


        const stripCanvas =
            document.createElement(
                "canvas"
            );


        const ctx =
            stripCanvas.getContext(
                "2d"
            );


        const width =
            700;


        const photoWidth =
            width - 70;


        const photoHeight =
            520;


        const padding =
            35;


        const header =
            95;


        const footer =
            70;


        stripCanvas.width =
            width;


        stripCanvas.height =

            header +

            (photoHeight * 4) +

            (padding * 5) +

            footer;



        /* Paper */

        ctx.fillStyle =
            "#faf9f4";


        ctx.fillRect(

            0,
            0,

            width,
            stripCanvas.height

        );



        /* Header */

        ctx.fillStyle =
            "#252525";


        ctx.textAlign =
            "center";


        ctx.font =
            "600 42px Caveat";


        ctx.fillText(

            "yenvy's booth",

            width / 2,

            50

        );


        ctx.font =
            "12px monospace";


        ctx.fillText(

            "⋆˚꩜｡ DEVELOPED IN THE MOMENT",

            width / 2,

            76

        );



        let loaded =
            0;


        capturedPhotos.forEach(
            (src, index) => {


                const img =
                    new Image();


                img.onload =
                    () => {


                        const y =

                            header +

                            padding +

                            index *
                            (
                                photoHeight +
                                padding
                            );


                        ctx.drawImage(

                            img,

                            padding,

                            y,

                            photoWidth,

                            photoHeight

                        );


                        /* Photo border */

                        ctx.strokeStyle =
                            "#252525";


                        ctx.lineWidth =
                            2;


                        ctx.strokeRect(

                            padding,

                            y,

                            photoWidth,

                            photoHeight

                        );


                        loaded++;


                        if (
                            loaded === 4
                        ) {


                            const date =
                                new Date();


                            const formattedDate =

                                date.getFullYear() +

                                "." +

                                String(
                                    date.getMonth() + 1
                                ).padStart(
                                    2,
                                    "0"
                                ) +

                                "." +

                                String(
                                    date.getDate()
                                ).padStart(
                                    2,
                                    "0"
                                );



                            /* Footer */

                            ctx.fillStyle =
                                "#252525";


                            ctx.textAlign =
                                "left";


                            ctx.font =
                                "18px Caveat";


                            ctx.fillText(

                                formattedDate,

                                padding,

                                stripCanvas.height -
                                25

                            );


                            ctx.textAlign =
                                "center";


                            ctx.font =
                                "20px Caveat";


                            ctx.fillText(

                                ".✦ ݁˖",

                                width / 2,

                                stripCanvas.height -
                                25

                            );


                            ctx.textAlign =
                                "right";


                            ctx.font =
                                "10px monospace";


                            ctx.fillText(

                                "ROLL 001",

                                width - padding,

                                stripCanvas.height -
                                25

                            );



                            /* Download */

                            const link =
                                document.createElement(
                                    "a"
                                );


                            link.download =
                                "yenvys-booth.png";


                            link.href =
                                stripCanvas.toDataURL(
                                    "image/png"
                                );


                            link.click();

                        }

                    };


                img.src =
                    src;

            }

        );

    }

);



/* =====================================
   BUTTONS
===================================== */

startButton.addEventListener(
    "click",
    startCamera
);


takeButton.addEventListener(
    "click",
    takePhotos
);

</script>

</body>
</html>
